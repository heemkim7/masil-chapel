<html><head><link rel="stylesheet" href="/css/ds.css"><style>body{background:#fbf7ff;font:11px sans-serif;color:#7a5fb0;margin:10px}.g{display:grid;grid-template-columns:repeat(12,90px);gap:6px}.c{text-align:center;background:#fff;border-radius:10px;padding:6px}.c .ic{display:block;margin:2px auto}</style></head><body><div class="g" id="g"></div>
<script type="module">import {ICONS,svg} from '/js/icons.js';const g=document.getElementById('g');for(const n of Object.keys(ICONS)){g.insertAdjacentHTML('beforeend',`<div class="c">${svg(n).replace('class="ic ','style="width:32px;height:32px" class="ic ')}${svg(n).replace('class="ic ','style="width:64px;height:64px" class="ic ')}${n}</div>`)}window.done=1</script></body></html>
